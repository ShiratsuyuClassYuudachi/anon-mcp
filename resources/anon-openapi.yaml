      responses:
        '200':
          description: 日程分组列表
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items: { $ref: '#/components/schemas/ScheduleGroup' }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/projects/{id}/dashboard/preferences:
    get:
      tags: [工作台仪表盘]
      summary: 获取工作台偏好
      description: 需项目成员身份。无记录时返回默认值（defaultView 依权限默认为 project/personal）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 工作台偏好
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardPreferences' }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      tags: [工作台仪表盘]
      summary: 更新工作台偏好
      description: 需项目成员身份。字段均可选；卡片数组各截断至 20 条；幂等 upsert。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                defaultView: { type: string, enum: [personal, project] }
                collapsedCards:
                  type: array
                  items: { type: string }
                hiddenCards:
                  type: array
                  items: { type: string }
                scheduleRange: { type: integer, enum: [7, 30] }
                cardOrder:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: 更新后的偏好
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardPreferences' }
        '400':
          description: 参数错误（bad_request：defaultView 无效 / 卡片字段必须是数组 / scheduleRange 必须是 7 或 30）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/projects/{id}/activities:
    get:
      tags: [项目动态]
      summary: 列出项目动态
      description: 需项目成员身份。按创建时间倒序；带权限门（permissionGate）的动态仅对拥有该权限点（或 project:manage）的成员可见。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 30, maximum: 50 }
          description: 数量上限 50
        - name: before
          in: query
          schema: { type: string, format: date-time }
          description: 取早于该时间的动态（翻页游标）
        - name: sourceType
          in: query
          schema: { type: string }
          description: 按来源类型过滤
      responses:
        '200':
          description: 动态时间线
          content:
            application/json:
              schema:
                type: object
                required: [activities, hasMore]
                properties:
                  activities:
                    type: array
                    items: { $ref: '#/components/schemas/ActivityItem' }
                  hasMore: { type: boolean }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
