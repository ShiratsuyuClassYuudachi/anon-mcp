  /api/projects/{id}/onsite:
    get:
      tags: [现场任务单]
      summary: 现场模式聚合
      description: 现场模式聚合接口（项目成员）。myModules 为指派给本人的模块（含本人确认/签到/完成状态与 state 流转）；emergency 为可见的紧急/重要公告（≤5 条）；contacts 为填写了联系方式的成员；incidents 按权限可见（work:manage 见全部，普通成员仅自己上报的）；rundowns 为舞台执行聚合（≤5 条，执行中的 Rundown 恒在列，未开始的仅取开始时间 ±24h 窗口内）；myPermissions 为本人权限点数组（前端据此显隐现场页权限入口）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 现场模式聚合数据
          content:
            application/json:
              schema:
                type: object
                required: [now, myModules, emergency, contacts, incidents, rundowns, myPermissions]
                properties:
                  now: { type: string, format: date-time, description: 服务器当前时间 }
                  myModules:
                    type: array
                    description: 指派给本人的模块，按 state（current/upcoming/done）再按开始时间排序
                    items:
                      type: object
                      required: [id, name, location, startAt, endAt, myAssignee, state]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        location: { type: string, nullable: true }
                        startAt: { type: string, format: date-time, nullable: true }
                        endAt: { type: string, format: date-time, nullable: true }
                        myAssignee:
                          type: object
                          nullable: true
                          description: 本人在该模块的确认/签到/完成时间
                          required: [confirmedAt, checkedInAt, completedAt]
                          properties:
                            confirmedAt: { type: string, format: date-time, nullable: true }
                            checkedInAt: { type: string, format: date-time, nullable: true }
                            completedAt: { type: string, format: date-time, nullable: true }
                        state: { type: string, enum: [current, upcoming, done], description: current 进行中；upcoming 未开始；done 已完成 }
                  emergency:
                    type: array
                    description: 可见的紧急/重要公告（≤5 条）
                    items:
                      type: object
                      required: [id, title, content, type, publishedAt]
                      properties:
                        id: { type: string }
                        title: { type: string }
                        content: { type: string }
                        type: { type: string, enum: [emergency, important] }
                        publishedAt: { type: string, format: date-time }
                  contacts:
                    type: array
                    description: 填写了联系方式的成员
                    items:
                      type: object
                      required: [userId, name, roleName, contacts]
                      properties:
                        userId: { type: string }
                        name: { type: string }
                        roleName: { type: string, nullable: true }
                        contacts:
                          type: array
                          items:
                            type: object
                            required: [platform, value]
                            properties:
                              platform: { type: string }
                              value: { type: string }
                  incidents:
                    type: array
                    description: 按权限可见的现场异常（work:manage 见全部，普通成员仅自己上报的）
                    items: { $ref: '#/components/schemas/OnsiteIncident' }
                  rundowns:
                    type: array
                    description: 舞台执行聚合（≤5 条；执行中恒在列，未开始的取开始时间 ±24h 窗口内）
                    items:
                      type: object
                      required: [id, name, status, startAt, itemCount, currentIndex, currentItemId, currentItemName, currentPlannedStart, currentActualStart, shiftMin]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        status: { type: string, enum: [idle, running] }
                        startAt: { type: string, format: date-time }
                        itemCount: { type: integer }
                        currentIndex: { type: integer, nullable: true, description: idle 时为 null }
                        currentItemId: { type: string, nullable: true }
                        currentItemName: { type: string, nullable: true }
                        currentPlannedStart: { type: string, format: date-time, nullable: true }
                        currentActualStart: { type: string, format: date-time, nullable: true }
                        shiftMin: { type: integer, description: 整体偏移分钟数；idle 时为 0 }
                  myPermissions:
                    type: array
                    description: 本人权限点数组
                    items: { type: string }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非项目成员（forbidden / api_key_wrong_project）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
