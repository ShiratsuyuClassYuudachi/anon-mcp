            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [现场任务单]
      summary: 删除任务模块
      description: 需 work:manage 权限。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: mid
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 无 work:manage 权限（forbidden / api_key_wrong_project）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 模块不存在（not_found）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/projects/{id}/work-modules/{mid}/confirm:
    post:
      tags: [现场任务单]
      summary: 确认任务分配
      description: 确认成员与模块的分配关系，记录确认时间与确认人；重复确认幂等，不刷新时间戳。不传 userId 为确认本人（项目成员即可）；传 userId 为代他人确认，需 work:manage 或 project:manage。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: mid
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                userId: { type: string, description: 目标成员；缺省为本人 }
      responses:
        '200':
          description: 确认成功
          content:
            application/json:
              schema:
                type: object
                required: [module]
                properties:
                  module: { $ref: '#/components/schemas/WorkModuleItem' }
        '400':
          description: 目标未被分配到该模块（bad_request）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 无权代他人确认（forbidden / api_key_wrong_project）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 模块不存在（not_found）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/projects/{id}/work-modules/{mid}/unconfirm:
    post:
      tags: [现场任务单]
      summary: 取消任务确认
      description: 清除 confirmedAt/confirmedBy。请求体与权限同 confirm。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: mid
