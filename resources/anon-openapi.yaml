          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/projects/{id}/announcements:
    get:
      tags: [公告]
      summary: 列出公告
      description: 需项目成员身份。置顶优先，其后按发布时间倒序；按当前用户可见范围过滤，total 为可见总数。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
          description: 页码
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
          description: 每页数量，上限 50
        - name: includeExpired
          in: query
          schema: { type: boolean }
          description: 传 true 时包含已过期公告（默认排除）
      responses:
        '200':
          description: 公告分页列表
          content:
            application/json:
              schema:
                type: object
                required: [announcements, total, page]
                properties:
                  announcements:
                    type: array
                    items: { $ref: '#/components/schemas/AnnouncementItem' }
                  total: { type: integer, description: 当前用户可见总数 }
                  page: { type: integer }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [公告]
      summary: 发布公告
      description: 需 announcement:manage 权限（project:manage 等价放行）。重要/紧急公告发布时向可见范围内成员发通知。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                content: { type: string }
                type: { type: string, enum: [normal, important, emergency] }
                isPinned: { type: boolean }
                requireConfirmation: { type: boolean }
                visibility:
                  $ref: '#/components/schemas/Visibility'
                expiresAt: { type: string, format: date-time, nullable: true }
      responses:
        '201':
          description: 发布成功
          content:
            application/json:
              schema:
                type: object
                required: [announcement]
                properties:
                  announcement:
                    type: object
                    required: [id, title]
                    properties:
                      id: { type: string }
                      title: { type: string }
        '400':
          description: 参数错误（bad_request：标题必填 / 公告类型无效 / 截止时间无效）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 无 announcement:manage 权限（forbidden / api_key_forbidden / api_key_wrong_project）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
