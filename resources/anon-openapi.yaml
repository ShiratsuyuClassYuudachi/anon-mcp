        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: riskId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 恢复成功
          content:
            application/json:
              schema:
                type: object
                required: [risk]
                properties:
                  risk: { $ref: '#/components/schemas/RiskItem' }
