  /api/projects/{id}/accounts:
    get:
      tags: [平台账号]
      summary: 列出平台账号
      description: 项目成员可用，仅返回当前用户可见范围内（visibility 校验）的账号，不含密文/明文。超管不受可见范围限制。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: platform
          in: query
          schema: { type: string }
          description: 按平台筛选（如 QQ/小红书/B站/微博/其他）
      responses:
        '200':
          description: 账号列表
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items:
                      type: object
                      required: [id, platform, account, mode, cipherKeySource, hasPassword, note, addedBy, visibility, createdAt]
                      properties:
                        id: { type: string }
                        platform: { type: string }
                        account: { type: string }
                        mode:
                          type: string
                          enum: [full, otp, contact]
                        cipherKeySource:
                          type: string
                          enum: [user, server]
                          nullable: true
                        hasPassword: { type: boolean }
                        note: { type: string }
                        addedBy:
                          type: object
                          nullable: true
                          required: [userId, name]
                          properties:
                            userId: { type: string }
                            name: { type: string }
                            contacts:
                              type: string
                              description: 仅 otp 模式返回
                        visibility: { $ref: '#/components/schemas/Visibility' }
                        createdAt: { type: string, format: date-time }
        '401':
          description: 未登录（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非项目成员或密钥越权（forbidden / api_key_wrong_project）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 项目不存在（not_found）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [平台账号]
      summary: 新增平台账号
      description: "需 accounts:manage 权限。mode 为 full 时密码二选一：浏览器加密（默认）传 passwordCipher（ANONv1 格式密文，服务端原样存储）；服务端加密传 cipherKeySource=server 加 password 明文（服务端加密后存储）。otp/contact 模式不传密码字段。"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, account, mode]
              properties:
                platform: { type: string }
                account: { type: string }
                mode:
                  type: string
                  enum: [full, otp, contact]
                note: { type: string }
                visibility: { $ref: '#/components/schemas/Visibility' }
                passwordCipher:
                  type: string
                  description: 浏览器加密密文（ANONv1 前缀，仅 full 模式）
                cipherKeySource:
                  type: string
                  enum: [server]
                  description: 传 server 表示由服务端加密（仅 full 模式）
                password:
                  type: string
                  description: 明文密码（仅 cipherKeySource=server 且 full 模式）
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                required: [account]
                properties:
                  account:
                    type: object
                    description: 结构同列表项
        '400':
          description: 参数错误（bad_request，平台/账号/mode/密码/visibility 校验失败）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未登录（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 无权限或非项目成员（forbidden / api_key_wrong_project）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 项目不存在（not_found）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/projects/{id}/accounts/{accountId}:
