      security: [{ cronSecret: [] }]
      responses:
        '200':
          description: 发送成功
          content:
            application/json:
              schema:
                type: object
                required: [sent]
                properties:
                  sent: { type: integer, description: 实际投递的周报条数 }
        '401':
          description: 密钥错误（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: 未配置 CRON_SECRET（cron_disabled）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
