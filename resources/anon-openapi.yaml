          required: true
          schema: { type: string }
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        '401':
          description: 未登录（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 无权限、非项目成员或不在可见范围内（forbidden / api_key_wrong_project）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 项目或账号不存在（not_found）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/projects/{id}/accounts/{accountId}/reveal:
    post:
      tags: [平台账号]
      summary: 查看账号密码
      description: 项目成员且在该账号可见范围内可用，仅 full 模式。server 模式返回 { password } 明文；user 模式返回 { cipher }（ANONv1 密文），前端提示输入保险库口令后用 WebCrypto 本地解密。非 full 模式或无密码返回 400。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: accountId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: server 模式返回 password 明文；user 模式返回 cipher 密文
          content:
            application/json:
              schema:
                type: object
                properties:
                  password:
                    type: string
                    description: 明文密码（cipherKeySource=server 时）
                  cipher:
                    type: string
                    description: ANONv1 密文（cipherKeySource=user 时）
        '400':
          description: 该账号没有可查看的密码（bad_request，非 full 模式或无密码）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未登录（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非项目成员、密钥越权或不在可见范围内（forbidden / api_key_wrong_project）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 项目或账号不存在（not_found）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/projects/{id}/work-modules:
    get:
      tags: [现场任务单]
      summary: 列出任务模块
      description: 列出项目全部现场任务模块，按创建时间升序。需项目成员身份。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 模块列表
          content:
            application/json:
              schema:
                type: object
                required: [modules]
                properties:
                  modules:
                    type: array
                    items: { $ref: '#/components/schemas/WorkModuleItem' }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非项目成员或密钥不属于本项目（forbidden / api_key_wrong_project）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [现场任务单]
      summary: 创建任务模块
      description: 需 work:manage 权限（project:manage 等价放行，超管不受限）。assigneeIds 必须全部为项目成员；创建后通知被分配成员。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
                description: { type: string }
                location: { type: string }
                startAt: { type: string, format: date-time, description: 须为合法时间且不晚于 endAt }
                endAt: { type: string, format: date-time }
                requiredCount: { type: integer, minimum: 1, default: 1 }
                assigneeIds:
                  type: array
                  items: { type: string }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                required: [module]
                properties:
                  module: { $ref: '#/components/schemas/WorkModuleItem' }
        '400':
          description: 参数错误（bad_request，名称缺失或超长、时间非法或先后颠倒、requiredCount 非 ≥1 整数、assigneeIds 含非法 ID 或非项目成员）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 无 work:manage 权限（forbidden / api_key_wrong_project）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
