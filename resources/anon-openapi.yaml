        - name: assignee
          in: query
          schema: { type: string }
          description: 按指派人 userId 过滤
        - name: status
          in: query
          schema: { type: string, enum: [open, done] }
          description: 按状态过滤
        - name: sort
          in: query
          schema: { type: string, enum: [createdAt, dueAt, nodeAt], default: createdAt }
          description: 排序字段
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
          description: 排序方向
      responses:
        '200':
          description: 待办列表
          content:
            application/json:
              schema:
                type: object
                required: [todos]
                properties:
                  todos:
                    type: array
                    items: { $ref: '#/components/schemas/TodoItem' }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [待办]
      summary: 创建待办
      description: 需 todo:create 权限（project:manage 等价放行）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                category: { type: string }
                assigneeIds:
                  type: array
                  items: { type: string }
                  description: 指派人 userId 列表，必须全部为项目成员
                nodeAt: { type: string, format: date-time }
                dueAt: { type: string, format: date-time }
                remindAt: { type: string, format: date-time }
                note: { type: string }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                required: [todo]
                properties:
                  todo: { $ref: '#/components/schemas/TodoItem' }
        '400':
          description: 参数错误（bad_request：标题必填 / 指派人必须是项目成员 / 时间格式无效）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 无 todo:create 权限（forbidden / api_key_forbidden / api_key_wrong_project）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
