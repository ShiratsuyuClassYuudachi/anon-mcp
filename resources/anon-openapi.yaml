openapi: 3.0.3
info:
  title: ANON API
  version: 0.1.0
  description: 漫展/线下活动执行组协作工具 ANON 的 HTTP API 机器可读规范。各端点的详细语义（权限口径、业务规则、字段含义）以 docs/api.md 为准；本规范与其冲突时以代码与 docs/api.md 为准。
servers:
  - url: 'http://localhost:4000'
    description: 本地开发
security:
  - bearerAuth: []
tags:
  - name: 系统
  - name: 认证
  - name: 个人资料
  - name: 超管后台
  - name: 项目
  - name: 里程碑
  - name: 邀请接受
  - name: 文件
  - name: 待办
  - name: 公告
  - name: 工作台仪表盘
  - name: 项目动态
  - name: 风险预警
  - name: 定时提醒
  - name: 推送订阅
  - name: 财务
  - name: 物料管理
  - name: 实物清单
  - name: 平台账号
  - name: 现场任务单
  - name: 舞台 Rundown
  - name: 舞台报名审核
  - name: 失物招领
  - name: 自定义工具
  - name: OpenAPI 密钥
  - name: QQ 机器人
paths:
  /api/health:
    get:
      tags: [系统]
      summary: 健康检查
      security: []
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
  /api/auth/register:
    post:
      tags: [认证]
      summary: 注册
      description: 普通用户必须带有效邀请码；当数据库无任何用户且配置了 SUPER_ADMIN_EMAIL 且邮箱匹配时，可不带邀请码注册并自动成为超级管理员。password ≥ 8 位。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, password]
              properties:
                inviteCode: { type: string }
                email: { type: string, format: email }
                name: { type: string }
                password: { type: string, description: 至少 8 位 }
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                type: object
                required: [token, refreshToken, user]
                properties:
                  token: { type: string }
                  refreshToken: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '400':
          description: 参数错误（bad_request / invalid_invite 邀请码无效）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 邮箱冲突（email_taken 已注册 / email_reserved 试用账号邮箱保留）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: 限流（rate_limited，每 IP 15 分钟最多 50 次）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/auth/login:
    post:
      tags: [认证]
      summary: 登录
      description: 试用模式：邮箱等于 TRIAL_EMAIL（默认 admin@test.com，置空禁用）且未被真实用户占用时，按密码哈希进入独立演示环境，响应带 trialExpiresAt。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                required: [token, refreshToken, user]
                properties:
                  token: { type: string }
                  refreshToken: { type: string }
                  user: { $ref: '#/components/schemas/User' }
                  trialExpiresAt: { type: string, format: date-time, description: 试用会话销毁时间（仅试用登录返回） }
        '400':
          description: 参数错误（bad_request，如试用密码不足 8 位）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 凭证错误（bad_credentials）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: 限流（rate_limited / trial_limit 活跃试用环境超限）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/auth/refresh:
    post:
      tags: [认证]
      summary: 刷新凭证
      description: 用 refresh token 换新凭证对。refresh token 本身是凭证，无需 Authorization 头。每次刷新轮换：旧 refresh token 立即作废；access token 有效期 15 分钟。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: 新凭证对
          content:
            application/json:
              schema:
                type: object
                required: [token, refreshToken, user]
                properties:
                  token: { type: string }
                  refreshToken: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '400':
          description: 缺少 refreshToken（bad_request）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: refresh token 无效/已过期/已轮换/已吊销（invalid_refresh）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: 限流（rate_limited）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/auth/logout:
    post:
      tags: [认证]
      summary: 登出
      description: 吊销 refresh token（登出后不可再刷新）。无 token 时也返回成功。
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: 已登出
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        '429':
          description: 限流（rate_limited）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/me:
    get:
      tags: [个人资料]
      summary: 获取当前用户资料
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                type: object
                required: [user, trialExpiresAt]
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  trialExpiresAt: { type: string, format: date-time, nullable: true, description: 试用会话销毁时间，非试用恒为 null }
                  qq:
                    type: object
                    description: QQ 通知渠道状态
                    required: [enabled, bound]
                    properties:
                      enabled: { type: boolean, description: 部署是否配置了 QQ 机器人凭证 }
                      bound: { type: boolean, description: 当前用户是否已绑定 QQ（openid 不外泄） }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      tags: [个人资料]
      summary: 更新当前用户资料
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                contacts:
                  type: array
                  items:
                    type: object
                    required: [platform, value]
                    properties:
                      platform: { type: string }
                      value: { type: string }
      responses:
        '200':
          description: 更新后的用户
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/me/qq-bind-code:
    post:
      tags: [个人资料]
      summary: 生成 QQ 绑定码
      description: 生成 6 位数字一次性绑定码（10 分钟有效，同用户单一有效码——重复生成旧码作废）。随后在 QQ 私聊机器人发送「绑定 XXXXXX」完成关联。
      responses:
        '201':
          description: 绑定码
          content:
            application/json:
              schema:
                type: object
                required: [code, expiresAt]
                properties:
                  code: { type: string, pattern: '^\d{6}$' }
                  expiresAt: { type: string, format: date-time }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: 部署未启用 QQ 通知（qq_disabled）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/me/qq-binding:
    delete:
      tags: [个人资料]
      summary: 解绑 QQ
      description: 清除当前用户的 QQ 绑定（幂等）。
      responses:
        '200':
          description: 解绑结果
          content:
            application/json:
              schema:
                type: object
                required: [qqBound]
                properties:
                  qqBound: { type: boolean, enum: [false] }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/me/onboarded:
    post:
      tags: [个人资料]
      summary: 标记已完成新手引导
      description: 幂等：仅首次调用写入 onboardedAt，重复调用不刷新时间戳。
      responses:
        '200':
          description: 更新后的用户
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/admin/invite-codes:
    get:
      tags: [超管后台]
      summary: 列出邀请码
      description: 需 isSuperAdmin。
      responses:
        '200':
          description: 邀请码列表
          content:
            application/json:
              schema:
                type: object
                required: [inviteCodes]
                properties:
                  inviteCodes:
                    type: array
                    items:
                      type: object
                      required: [id, code, used, usedAt, createdAt]
                      properties:
                        id: { type: string }
                        code: { type: string }
                        used: { type: boolean }
                        usedAt: { type: string, format: date-time, nullable: true }
                        createdAt: { type: string, format: date-time, nullable: true }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非超级管理员（forbidden）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [超管后台]
      summary: 创建邀请码
      description: 需 isSuperAdmin。不传 code 则自动生成 ANON-XXXXXXXX；自定义 code 最少 6 位。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, description: 最少 6 位 }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                required: [id, code]
                properties:
                  id: { type: string }
                  code: { type: string }
        '400':
          description: 参数错误（bad_request）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非超级管理员（forbidden）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/invites/{token}:
    get:
      tags: [邀请接受]
      summary: 查看邀请信息
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 邀请信息
          content:
            application/json:
              schema:
                type: object
                required: [invite]
                properties:
                  invite:
                    type: object
                    required: [projectName, roleName, expiresAt, targeted]
                    properties:
                      projectName: { type: string }
                      roleName: { type: string }
                      expiresAt: { type: string, format: date-time }
                      targeted: { type: boolean, description: 是否指定用户 }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 邀请指定给他人（forbidden）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 邀请不存在（not_found）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: 邀请已用/过期（invite_gone）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/invites/{token}/accept:
    post:
      tags: [邀请接受]
      summary: 接受邀请
      description: 已加入项目则更新角色。
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 已加入
          content:
            application/json:
              schema:
                type: object
                required: [ok, projectId]
                properties:
                  ok: { type: boolean }
                  projectId: { type: string }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 邀请指定给他人（forbidden）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 邀请不存在（not_found）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: 邀请已用/过期（invite_gone）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/push/config:
    get:
      tags: [推送订阅]
      summary: 获取 Web Push 配置
      description: 返回 VAPID 公钥；未配置为 null，前端据此隐藏订阅入口。
      responses:
        '200':
          description: 推送配置
          content:
            application/json:
              schema:
                type: object
                required: [publicKey]
                properties:
                  publicKey: { type: string, nullable: true, description: VAPID 公钥 }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/push/subscription:
    post:
      tags: [推送订阅]
      summary: 订阅推送
      description: 同一用户同一 endpoint 幂等 upsert；每用户最多保留 20 条订阅，超出淘汰最旧。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, p256dh, auth]
              properties:
                endpoint: { type: string, description: 必须 https（或 localhost http） }
                p256dh: { type: string, description: URL-safe base64 }
                auth: { type: string, description: URL-safe base64 }
                userAgent: { type: string, description: 不超过 300 字 }
      responses:
        '200':
          description: 已订阅
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        '400':
          description: 参数错误（bad_request：endpoint 非法 / 密钥格式不符）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [推送订阅]
      summary: 取消推送订阅
      description: 仅删除当前用户名下的该订阅。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string }
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                type: object
                required: [ok, removed]
                properties:
                  ok: { type: boolean }
                  removed: { type: integer, description: 删除条数 }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/open/exchange:
    post:
      tags: [OpenAPI 密钥]
      summary: 启动令牌兑换 API 密钥
      description: 限流 60 次/15 分钟/IP。生效 scopes = 工具 scopes ∩ 用户当前角色权限；同 (user, tool) 重复兑换顶替旧密钥（旧密钥立即失效）。恒 30 天有效。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [launchToken]
              properties:
                launchToken: { type: string, description: 自定义工具 launch 端点签发的 5 分钟启动令牌 }
      responses:
        '201':
          description: 兑换成功（apiKey 原文仅此一次返回）
          content:
            application/json:
              schema:
                type: object
                required: [apiKey, expiresAt, scopes, projectId, user]
                properties:
                  apiKey: { type: string, description: anonk_ 前缀密钥原文 }
                  expiresAt: { type: string, format: date-time }
                  scopes:
                    type: array
                    items: { type: string }
                  projectId: { type: string }
                  user:
                    type: object
                    required: [id, name]
                    properties:
                      id: { type: string }
                      name: { type: string }
        '400':
          description: 参数错误（bad_request）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: launchToken 无效/过期（invalid_launch_token）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非项目成员（forbidden）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 工具已删除（not_found）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: 限流（rate_limited）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/open/me:
    get:
      tags: [OpenAPI 密钥]
      summary: 查看当前 API 密钥身份
      description: 需 API 密钥调用；permissions 为密钥 scopes 与持有者实时角色权限的交集。
      responses:
        '200':
          description: 密钥身份
          content:
            application/json:
              schema:
                type: object
                required: [user, project, permissions, expiresAt]
                properties:
                  user:
                    type: object
                    required: [id, name]
                    properties:
                      id: { type: string }
                      name: { type: string }
                  project:
                    type: object
                    required: [id, name]
                    properties:
                      id: { type: string }
                      name: { type: string }
                  permissions:
                    type: array
                    items: { type: string }
                  expiresAt: { type: string, format: date-time, nullable: true, description: 永久密钥为 null }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 以用户 JWT 调用（api_key_required）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/open/keys:
    get:
      tags: [OpenAPI 密钥]
      summary: 列出本人 API 密钥
      description: 用户态接口，API 密钥不可调。仅本人密钥，createdAt 倒序。
      responses:
        '200':
          description: 密钥列表
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items: { $ref: '#/components/schemas/ApiKeyInfo' }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: API 密钥调用用户态接口（api_key_forbidden）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [OpenAPI 密钥]
      summary: 自助生成 API 密钥
      description: 用户态接口，API 密钥不可调。scopes 静默收窄为「合法且用户实际持有」的子集；permanent=true 永久有效，否则 30 天。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, name]
              properties:
                projectId: { type: string }
                name: { type: string, description: 必填，不超过 50 字 }
                scopes:
                  type: array
                  items: { type: string }
                permanent: { type: boolean }
      responses:
        '201':
          description: 创建成功（apiKey 原文仅此一次返回）
          content:
            application/json:
              schema:
                type: object
                required: [apiKey, key]
                properties:
                  apiKey: { type: string, description: anonk_ 前缀密钥原文 }
                  key: { $ref: '#/components/schemas/ApiKeyInfo' }
        '400':
          description: 参数错误（bad_request）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
