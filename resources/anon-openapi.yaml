    post:
      tags: [定时提醒]
      summary: 扫描发送到期提醒
      description: 运维端点。扫描所有 status=open 且 remindAt/dueAt 已到期的待办通知指派人，同时扫描 3 天内到期的未完成里程碑通知项目管理者；每条只发一次（ReminderLog 去重）。
      security: [{ cronSecret: [] }]
      responses:
        '200':
          description: 发送成功
          content:
            application/json:
              schema:
                type: object
                required: [sent]
                properties:
                  sent: { type: integer, description: 实际投递的提醒条数 }
        '401':
          description: 密钥错误（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: 未配置 CRON_SECRET（cron_disabled）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
