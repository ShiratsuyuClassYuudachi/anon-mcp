        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 汇总指标与模块概览
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardSummary' }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
