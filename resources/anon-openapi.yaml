  /api/projects/{id}/invites:
    post:
      tags: [项目]
      summary: 创建项目邀请
      description: 需 member:manage 权限。不传 targetUserId 为开放链接（任何登录用户可接受，一次性）；传入则仅该用户可接受。前端拼 location.origin + url 发给对方。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleName]
              properties:
                roleName: { type: string }
                targetUserId: { type: string, description: 限定接受人（可选） }
                expiresInHours: { type: integer, description: 有效期小时数，默认 72，合法范围 1~720 }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                required: [token, url]
                properties:
                  token: { type: string }
                  url: { type: string, description: 形如 /invite/<token> 的相对路径 }
        '400':
          description: 参数错误（bad_request，角色不存在/目标用户不存在/有效期越界）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 禁止访问（forbidden / api_key_wrong_project）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 项目不存在（not_found）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/projects/{id}/qq-bind-code:
    post:
      tags: [项目]
      summary: 生成项目 QQ 群绑定码
      description: 需 project:manage 权限。生成 6 位数字一次性绑定码（10 分钟有效，同项目单一有效码——重复生成旧码作废；绑定多个群时顺序生成绑定即可）。随后把机器人拉进 QQ 群并 @机器人 发送「绑定 XXXXXX」完成关联；一个群同一时刻只属于一个项目，绑到新项目自动从旧项目解除，同项目重复绑定同群将其类型配置重置为全选。绑定后群里收到订阅的精选类型通知（里程碑临近/待办节点与到期提醒/重要紧急公告/新风险/现场异常/周报，逐群可配）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: 绑定码
          content:
            application/json:
              schema:
                type: object
                required: [code, expiresAt]
                properties:
                  code: { type: string, pattern: '^\d{6}$' }
                  expiresAt: { type: string, format: date-time }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 禁止访问（forbidden / api_key_wrong_project）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 项目不存在（not_found）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: 部署未启用 QQ 通知（qq_disabled）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/projects/{id}/qq-binding/{groupOpenId}:
    delete:
      tags: [项目]
      summary: 按群解绑项目 QQ 群
      description: 需 project:manage 权限。从项目的 qqGroups 中移除指定群（幂等，群不存在时返回原列表）。QQ 侧把机器人移出群（GROUP_DEL_ROBOT 事件）也会自动解绑。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: groupOpenId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 剩余绑定列表
          content:
            application/json:
              schema:
                type: object
                required: [qqGroups]
                properties:
                  qqGroups:
                    type: array
                    items: { $ref: '#/components/schemas/QqGroup' }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 禁止访问（forbidden / api_key_wrong_project）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 项目不存在（not_found）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      tags: [项目]
      summary: 配置单个群的订阅消息类型
      description: 需 project:manage 权限。types 去重后整体覆盖该群的订阅类型；每个值须为精选 7 类之一（milestone:approaching / todo:remind / todo:due / announcement:published / risk:new / incident:reported / weekly:report），空数组表示该群不接收任何群消息。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: groupOpenId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [types]
              properties:
                types:
                  type: array
                  items: { type: string, enum: [milestone:approaching, todo:remind, todo:due, announcement:published, risk:new, incident:reported, weekly:report] }
      responses:
        '200':
          description: 更新后的绑定列表
          content:
            application/json:
              schema:
                type: object
                required: [qqGroups]
                properties:
                  qqGroups:
                    type: array
                    items: { $ref: '#/components/schemas/QqGroup' }
        '400':
          description: 无效的通知类型（bad_request）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 禁止访问（forbidden / api_key_wrong_project）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 项目不存在或该群未绑定（not_found）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
