  /api/projects/{id}/dashboard:
    get:
      tags: [工作台仪表盘]
      summary: 获取工作台聚合数据
      description: 需项目成员身份。聚合首屏数据，按权限裁剪（无财务权限点时 summary.modules.finance 为 null）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: scheduleDays
          in: query
          schema: { type: integer, maximum: 30 }
          description: 日程天数；缺省用偏好的 scheduleRange，上限 30
      responses:
        '200':
          description: 聚合首屏数据
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary: { $ref: '#/components/schemas/DashboardSummary' }
                  myActions:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/DashboardActionItem' }
                  risks:
                    type: object
                    properties:
                      risks:
                        type: array
                        description: 精简字段（不含 resolvedAt 与忽略字段）
                        items: { $ref: '#/components/schemas/RiskItem' }
                      health: { $ref: '#/components/schemas/HealthStatus' }
                  schedule:
                    type: object
                    properties:
                      groups:
                        type: array
                        items: { $ref: '#/components/schemas/ScheduleGroup' }
                  announcements:
                    type: object
                    properties:
                      items:
                        type: array
                        description: 当前用户可见，至多 5 条
                        items: { $ref: '#/components/schemas/AnnouncementItem' }
                  activities:
                    type: object
                    properties:
                      items:
                        type: array
                        description: 至多 10 条
                        items: { $ref: '#/components/schemas/ActivityItem' }
                  preferences: { $ref: '#/components/schemas/DashboardPreferences' }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/projects/{id}/dashboard/summary:
    get:
      tags: [工作台仪表盘]
