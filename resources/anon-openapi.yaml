  /api/projects/{id}/stage-rundowns/{rid}:
    get:
      tags: [舞台 Rundown]
      summary: 获取 Rundown 详情
      description: 项目成员可查看。附件已解析为 StageRundownAttachment；缺失的文件 id 跳过。跨项目 rid 按 404 处理。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: rid
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Rundown 详情
          content:
            application/json:
              schema:
                type: object
                required: [rundown]
                properties:
                  rundown: { $ref: '#/components/schemas/StageRundown' }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 无权限（forbidden / api_key_forbidden / api_key_wrong_project）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Rundown 不存在（not_found）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      tags: [舞台 Rundown]
      summary: 更新 Rundown
      description: 需 tools:manage 权限。请求字段同创建（均可选）；name 提供但 trim 后为空、startAt 提供但不可解析返回 400。执行中（execution.status 为 running）仅 name/note 可改，修改 startAt 返回 409。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: rid
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                startAt: { type: string, format: date-time }
                note: { type: string }
      responses:
        '200':
          description: 更新后的 Rundown
          content:
            application/json:
              schema:
                type: object
                required: [rundown]
                properties:
                  rundown: { $ref: '#/components/schemas/StageRundown' }
        '400':
          description: 参数错误（bad_request）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 无权限（forbidden / api_key_forbidden / api_key_wrong_project）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Rundown 不存在（not_found）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 执行中禁止修改 startAt（EXECUTION_RUNNING）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [舞台 Rundown]
      summary: 删除 Rundown
      description: 需 tools:manage 权限。级联删除全部节目的素材文件（存储对象与 File 文档）与现场大屏分享文档。执行中禁止删除（409）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: rid
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 无权限（forbidden / api_key_forbidden / api_key_wrong_project）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Rundown 不存在（not_found）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 执行中禁止删除（EXECUTION_RUNNING）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/projects/{id}/stage-rundowns/{rid}/items:
    post:
      tags: [舞台 Rundown]
      summary: 新增节目
      description: 需 tools:manage 权限。multipart 表单；上传文件按顺序落库为 File 文档并记为节目附件。执行中禁止编排变更（409）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: rid
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, durationMin]
              properties:
                name: { type: string, description: 节目名，trim 后非空 }
                durationMin: { type: integer, description: 时长（分钟），须为 1–1440 的整数 }
                participants:
                  type: string
                  description: 参与人员的 JSON 字符串数组（元素为含 cn、contact 字段的对象）；解析失败或非数组返回 400；仅保留 cn trim 非空项，contact 缺省为空串
                note: { type: string }
                files:
                  type: array
                  description: 节目素材文件，最多 10 个，单个 ≤ 20MB
                  items: { type: string, format: binary }
      responses:
        '201':
          description: 新增成功
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item: { $ref: '#/components/schemas/StageRundownItem' }
        '400':
          description: 参数错误（bad_request：名称为空、durationMin 非 1–1440 整数或 participants 格式无效）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
