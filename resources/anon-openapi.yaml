  /api/projects/{id}/todos:
    get:
      tags: [待办]
      summary: 列出待办
      description: 需项目成员身份。支持按分类/指派人/状态过滤与排序。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: category
          in: query
