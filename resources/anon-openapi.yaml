                description: { type: string }
                location: { type: string }
                startAt: { type: string, format: date-time, nullable: true }
                endAt: { type: string, format: date-time, nullable: true }
                requiredCount: { type: integer, minimum: 1 }
                assigneeIds:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                required: [module]
