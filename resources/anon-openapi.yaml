            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 物品不存在（not_found）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      summary: 删除失物
      description: 需 lostfound:manage 权限。级联删除照片原图/预览图存储对象与 File 文档。
      tags: [失物招领]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 无权限（forbidden / api_key_forbidden / api_key_wrong_project）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 物品不存在（not_found）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/projects/{id}/lostfound/{itemId}/status:
    patch:
      summary: 流转失物认领状态
      description: 需 lostfound:manage 权限。claimed 记录 claimedAt 并保存 claimNote（未提供则保留原值）；pending 清空 claimedAt 与 claimNote；其余状态值 400「无效的状态」。
      tags: [失物招领]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, claimed]
                claimNote: { type: string, description: 认领备注/联系方式，仅项目内可见 }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item: { $ref: '#/components/schemas/LostFoundItem' }
        '400':
          description: 参数错误（bad_request，无效的状态）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 无权限（forbidden / api_key_forbidden / api_key_wrong_project）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 物品不存在（not_found）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/projects/{id}/lostfound/{itemId}/photo:
    get:
      summary: 获取失物照片
      description: 项目成员可读。有 WebP 预览时优先返回预览，否则返回原图；无照片返回 404。
      tags: [失物招领]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 照片二进制
          content:
            image/*:
              schema: { type: string, format: binary }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 物品或照片不存在（not_found）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/public/lostfound/{token}:
    get:
      summary: 公开查看失物列表
      description: 免登录，按分享 token 只读暴露，限流 300 次/分钟/IP。分享不存在或未开启返回 404「链接不存在或已关闭」。返回字段为白名单，不含 claimNote/createdBy 等内部字段。
      tags: [失物招领]
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
          description: 关键词，大小写不敏感匹配 name/note/foundLocation
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, claimed]
          description: 认领状态过滤，非法值忽略
      responses:
        '200':
          description: 公开失物列表（按 foundAt 倒序，上限 200 条）
          content:
            application/json:
              schema:
                type: object
                required: [projectName, items]
                properties:
                  projectName: { type: string }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PublicLostFoundItem' }
        '404':
          description: 链接不存在或已关闭（not_found）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: 触发限流（rate_limited）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/public/lostfound/{token}/items/{itemId}/photo:
    get:
      summary: 公开获取失物照片
      description: 免登录，限流 300 次/分钟/IP。item 必须属于该分享的项目，跨项目返回 404。
      tags: [失物招领]
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 照片二进制（有 WebP 预览时优先预览，否则原图）
          content:
            image/*:
              schema: { type: string, format: binary }
        '404':
          description: 链接不存在或已关闭 / 物品不存在 / 无照片（not_found）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: 触发限流（rate_limited）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/projects/{id}/custom-tools:
    get:
      summary: 列出自定义工具
      description: 项目成员可查看，按 createdAt 升序；创建者已注销显示「未知用户」。
      tags: [自定义工具]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 自定义工具列表
          content:
            application/json:
              schema:
                type: object
                required: [tools]
                properties:
                  tools:
                    type: array
                    items: { $ref: '#/components/schemas/CustomTool' }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      summary: 创建自定义工具
      description: 需 tools:manage 权限。name 必填且 ≤50；url 必须可解析且协议为 http/https（≤1000，否则 400 invalid_url）；mode 缺省 embed；description ≤200；scopes 超集静默过滤。
      tags: [自定义工具]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url]
              properties:
                name: { type: string, description: 工具名称，≤50 字符 }
                url: { type: string, description: 工具地址，仅 http/https，≤1000 字符 }
                description: { type: string, description: 描述，≤200 字符 }
                mode:
                  type: string
                  enum: [embed, link]
                  description: 打开方式，embed 为页内 iframe、link 为新标签页，缺省 embed
                passToken: { type: boolean, description: 打开时是否投递启动令牌，缺省 false }
                scopes:
                  type: array
                  items: { type: string }
                  description: 允许插件使用的权限点，非法项静默丢弃
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                required: [tool]
                properties:
                  tool: { $ref: '#/components/schemas/CustomTool' }
        '400':
          description: 参数错误（bad_request / invalid_url）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 无权限（forbidden / api_key_forbidden / api_key_wrong_project）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/projects/{id}/custom-tools/{toolId}:
    patch:
      summary: 更新自定义工具
      description: 需 tools:manage 权限。部分更新，校验同创建。
      tags: [自定义工具]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: toolId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                url: { type: string }
                description: { type: string }
                mode:
                  type: string
                  enum: [embed, link]
                passToken: { type: boolean }
                scopes:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                required: [tool]
                properties:
                  tool: { $ref: '#/components/schemas/CustomTool' }
        '400':
          description: 参数错误（bad_request / invalid_url）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 无权限（forbidden / api_key_forbidden / api_key_wrong_project）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 工具不存在（not_found）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      summary: 删除自定义工具
      description: 需 tools:manage 权限。删除工具并级联作废该工具签发的全部 API 密钥。
      tags: [自定义工具]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: toolId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 无权限（forbidden / api_key_forbidden / api_key_wrong_project）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 工具不存在（not_found）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/projects/{id}/custom-tools/{toolId}/launch:
    post:
      summary: 获取工具启动令牌
      description: 项目成员可用。passToken 为 false 时返回 400「该工具未开启身份携带」。令牌为 5 分钟有效 JWT（kind 为 tool-launch），前端经 postMessage 握手投递给组件（embed 走 window.parent、link 走 window.opener），令牌不进 URL。
      tags: [自定义工具]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: toolId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 启动令牌
          content:
            application/json:
              schema:
                type: object
                required: [launchToken]
                properties:
                  launchToken: { type: string, description: 5 分钟有效的启动令牌 JWT }
        '400':
          description: 该工具未开启身份携带（bad_request）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 工具不存在（not_found）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 两种 Bearer 凭证：用户 JWT（登录签发，15 分钟，refresh 轮换）与 anonk_ 前缀 API 密钥（OpenAPI 模式）。项目域接口二者皆可；/api/me、/api/admin、/api/push、/api/invites、/api/files、项目创建与全量列表仅接受用户 JWT，API 密钥调用返回 403 api_key_forbidden；密钥跨项目调用返回 403 api_key_wrong_project。
    cronSecret:
      type: http
      scheme: bearer
      description: CRON_SECRET 运维密钥（/api/cron/* 专用）
  schemas:
    Error:
      type: object
      description: 统一错误信封
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: 机器可读错误码 }
            message: { type: string, description: 人类可读信息 }
    User:
      type: object
      description: 用户
      required: [id, email, name, isSuperAdmin, contacts, onboardedAt]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        isSuperAdmin: { type: boolean }
        contacts:
          type: array
          items:
            type: object
            required: [platform, value]
            properties:
              platform: { type: string }
              value: { type: string }
        onboardedAt: { type: string, format: date-time, nullable: true, description: 新手引导完成时间 }
    ApiKeyInfo:
      type: object
      description: API 密钥元信息（不含原文）
      required: [id, name, projectId, projectName, toolId, toolName, scopes, createdAt, lastUsedAt, expiresAt]
      properties:
        id: { type: string }
        name: { type: string }
        projectId: { type: string }
        projectName: { type: string, description: 项目已删显示「已删除项目」 }
        toolId: { type: string, nullable: true, description: 工具兑换的有值，手动生成为 null }
        toolName: { type: string, nullable: true, description: 工具已删显示「已删除工具」 }
        scopes:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true, description: null = 永久 }
    Role:
      description: 项目角色与权限点集合
      type: object
      required: [name, permissions]
      properties:
        name: { type: string }
        permissions:
          type: array
          items: { type: string }
    Member:
      description: 项目成员
      type: object
      required: [userId, name, email, roleName]
      properties:
        userId: { type: string }
        name: { type: string }
        email: { type: string }
        roleName: { type: string }
    ProjectStatus:
      description: 项目状态
      type: string
      enum: [draft, preparing, active, settling, completed, archived, cancelled]
    HealthStatus:
      description: 项目健康度（计算口径见「风险预警」章节）
      type: string
      enum: [normal, attention, at_risk, critical]
    ProjectSummary:
      description: 项目列表项（含当前用户视角的角色与统计）
      type: object
      required: [id, name, description, status, startDate, endDate, myRole, currentStage, stageProgress, health, todoCompletionRate, activeRiskCount]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        startDate: { type: string, format: date-time, nullable: true }
        endDate: { type: string, format: date-time, nullable: true }
        myRole: { type: string, nullable: true }
        currentStage: { type: string, description: 第一个未完成阶段名；全部完成或无阶段时为空字符串 }
        stageProgress:
          type: object
          required: [completed, total]
          properties:
            completed: { type: integer }
            total: { type: integer }
        health: { $ref: '#/components/schemas/HealthStatus' }
        todoCompletionRate: { type: integer, description: 待办完成率（百分比整数） }
        activeRiskCount: { type: integer }
    ProjectDetail:
      description: 项目详情
      type: object
      required: [id, name, description, status, startDate, endDate, location, timezone, currentStage, stages, roles, createdBy, qqGroups, qqEnabled]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        startDate: { type: string, format: date-time, nullable: true }
        endDate: { type: string, format: date-time, nullable: true }
        location: { type: string }
        timezone: { type: string }
        currentStage: { type: string, description: 第一个未完成阶段名；全部完成或无阶段时为空字符串 }
        stages:
          type: array
          items: { $ref: '#/components/schemas/StageItem' }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        createdBy: { type: string }
        qqGroups:
          type: array
          description: 已绑定的 QQ 群列表（逐群订阅类型；空数组 = 未绑定）
          items: { $ref: '#/components/schemas/QqGroup' }
        qqEnabled: { type: boolean, description: 部署是否配置了 QQ 机器人凭证 }
    QqGroup:
      type: object
      required: [groupOpenId, types]
      properties:
        groupOpenId: { type: string, description: QQ 群 group_openid（项目成员可见，用于逐群配置/解绑寻址） }
        types:
          type: array
          description: 订阅的精选消息类型（空数组 = 不接收任何群消息）
          items: { type: string }
    StageItem:
      description: 项目阶段
      type: object
      required: [id, name, order, completedAt, note]
      properties:
        id: { type: string }
        name: { type: string }
        order: { type: integer }
        completedAt: { type: string, format: date-time, nullable: true }
        note: { type: string }
    MilestoneItem:
      description: 项目里程碑
      type: object
      required: [id, title, date, description, stageId, stageName, completedAt, createdBy]
      properties:
        id: { type: string }
        title: { type: string }
        date: { type: string, format: date-time }
        description: { type: string }
        stageId: { type: string, nullable: true, description: 关联的项目阶段 id（可空） }
        stageName: { type: string, nullable: true, description: 关联阶段名（可空） }
        completedAt: { type: string, format: date-time, nullable: true }
        createdBy:
          type: object
          required: [userId, name]
          properties:
            userId: { type: string }
            name: { type: string }
    TodoItem:
      description: 待办条目（含完成信息与进度时间线）
      type: object
      required: [id, title, category, assignees, nodeAt, dueAt, remindAt, status, note, createdBy, createdAt, completedAt, completedBy, completionNote, attachments, updates]
      properties:
        id: { type: string }
        title: { type: string }
        category: { type: string }
        assignees:
          type: array
          items:
            type: object
            required: [userId, name]
            properties:
              userId: { type: string }
              name: { type: string }
        nodeAt: { type: string, format: date-time, nullable: true }
        dueAt: { type: string, format: date-time, nullable: true }
        remindAt: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [open, done] }
        note: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        completedBy: { type: string, nullable: true }
        completionNote: { type: string, nullable: true }
        attachments:
          type: array
          items:
            type: object
            required: [id, filename]
            properties:
              id: { type: string }
              filename: { type: string }
        updates:
          type: array
          description: 进度时间线（追加式，不可编辑/删除）
          items:
            type: object
            required: [note, createdBy, createdByName, createdAt, attachments]
            properties:
              note: { type: string }
              createdBy: { type: string }
              createdByName: { type: string }
              createdAt: { type: string, format: date-time }
              attachments:
                type: array
                items:
                  type: object
                  required: [id, filename]
                  properties:
                    id: { type: string }
                    filename: { type: string }
    AnnouncementItem:
      description: 公告条目
      type: object
      required: [id, title, content, type, isPinned, requireConfirmation, publishedBy, publishedAt, expiresAt, confirmedByMe]
      properties:
        id: { type: string }
        title: { type: string }
        content: { type: string }
        type: { type: string, enum: [normal, important, emergency] }
        isPinned: { type: boolean }
        requireConfirmation: { type: boolean }
        publishedBy:
          type: object
          required: [userId, name]
          properties:
            userId: { type: string }
            name: { type: string }
        publishedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
        confirmedByMe: { type: boolean, description: 当前用户是否已确认知悉 }
    DashboardSummary:
      description: 仪表盘汇总指标与模块概览（无对应权限点时模块为 null）
      type: object
      required: [metrics, modules]
      properties:
        metrics:
          type: object
          required: [todoCompletionRate, overdueCount, budgetUsageRate, pendingMaterialCount, workConfirmationRate, memberCount, activeRiskCount]
          properties:
            todoCompletionRate: { type: number }
            overdueCount: { type: integer }
            budgetUsageRate: { type: number, nullable: true }
            pendingMaterialCount: { type: integer }
            workConfirmationRate: { type: number }
            memberCount: { type: integer }
            activeRiskCount: { type: integer }
        modules:
          type: object
          required: [todos, finance, materials, work]
          properties:
            todos:
              type: object
              required: [total, done, open, overdue, dueThisWeek, completionRate]
              properties:
                total: { type: integer }
                done: { type: integer }
                open: { type: integer }
                overdue: { type: integer }
                dueThisWeek: { type: integer }
                completionRate: { type: number }
            finance:
              type: object
              nullable: true
              description: 无财务权限点（finance:manage/finance:add）时为 null
              required: [ticketIncomeCents, incomeCents, expenseCents, profitCents]
              properties:
                ticketIncomeCents: { type: integer, description: 金额单位分 }
                incomeCents: { type: integer, description: 金额单位分 }
                expenseCents: { type: integer, description: 金额单位分 }
                profitCents: { type: integer, description: 金额单位分 }
            materials:
              type: object
              nullable: true
              required: [totalResources, noVersionCount, recentCount]
              properties:
                totalResources: { type: integer }
                noVersionCount: { type: integer }
                recentCount: { type: integer }
            work:
              type: object
              nullable: true
              required: [totalModules, totalRequired, totalAssigned, confirmedCount, shortageCount]
              properties:
                totalModules: { type: integer }
                totalRequired: { type: integer }
                totalAssigned: { type: integer }
                confirmedCount: { type: integer }
                shortageCount: { type: integer }
    DashboardActionItem:
      description: 本人待行动项（指派待办或未确认现场任务）
      type: object
      required: [id, sourceType, title, detail, dueAt, isOverdue, action]
      properties:
        id: { type: string }
        sourceType: { type: string, enum: [todo, work] }
        title: { type: string }
        detail: { type: string }
        dueAt: { type: string, format: date-time, nullable: true }
        isOverdue: { type: boolean }
        action: { type: string, enum: [complete, confirm] }
    ScheduleGroup:
      description: 日程分组（按日期聚合）
      type: object
      required: [date, label, items]
      properties:
        date: { type: string, description: YYYY-MM-DD }
        label: { type: string, description: 今天 / 明天 / MM-DD }
        items:
          type: array
          items:
            type: object
            required: [id, sourceType, title, time, allDay]
            properties:
              id: { type: string }
              sourceType: { type: string, enum: [todo, work, project, milestone] }
              title: { type: string }
              time: { type: string }
              allDay: { type: boolean }
    DashboardPreferences:
      description: 工作台个人偏好（无记录时返回默认值）
      type: object
      required: [defaultView, collapsedCards, hiddenCards, scheduleRange, cardOrder]
      properties:
        defaultView: { type: string, enum: [personal, project] }
        collapsedCards:
          type: array
          items: { type: string }
        hiddenCards:
          type: array
          items: { type: string }
        scheduleRange: { type: integer, enum: [7, 30] }
        cardOrder:
          type: array
          items: { type: string }
    ActivityItem:
      description: 项目动态条目
      type: object
      required: [id, actor, type, message, sourceType, sourceId, createdAt]
      properties:
        id: { type: string }
        actor:
          type: object
          required: [userId, name]
          properties:
            userId: { type: string }
            name: { type: string }
        type: { type: string }
        message: { type: string }
        sourceType: { type: string }
        sourceId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    RiskItem:
      description: 风险预警条目（仅 active 与 ignored 状态会被返回）
      type: object
      required: [id, ruleCode, level, sourceType, sourceId, title, description, status, firstDetectedAt, lastDetectedAt, resolvedAt, ignoredBy, ignoredUntil, ignoreReason]
      properties:
        id: { type: string }
        ruleCode: { type: string }
        level: { type: string, enum: [info, warning, critical] }
        sourceType: { type: string, enum: [todo, finance, material, work] }
        sourceId: { type: string, nullable: true }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [active, ignored] }
        firstDetectedAt: { type: string, format: date-time }
        lastDetectedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }
        ignoredBy: { type: string, nullable: true }
        ignoredUntil: { type: string, format: date-time, nullable: true }
        ignoreReason: { type: string, nullable: true }
    FileMeta:
      description: 文件元信息
      type: object
      required: [id, filename, mime, size]
      properties:
        id: { type: string }
        filename: { type: string }
        mime: { type: string }
        size: { type: integer, description: 字节数 }
    Visibility:
      description: 可见范围；两个数组均为空表示不限制（走权限点判定），非空则仅列出的用户或角色可见且优先于权限点
      type: object
      required: [userIds, roleNames]
      properties:
        userIds:
          type: array
          items: { type: string }
        roleNames:
          type: array
          items: { type: string }
    TxUser:
      description: 账目中的用户引用
      type: object
      required: [userId, name]
      properties:
        userId: { type: string }
        name: { type: string }
    TransactionItem:
      description: 财务账目
      type: object
      required: [id, type, amountCents, note, payer, splitAmong, createdBy, createdByName, createdAt, attachments]
      properties:
        id: { type: string }
        type: { type: string, enum: [income, expense] }
        amountCents: { type: integer, description: 金额（整数分） }
        note: { type: string }
        payer:
          $ref: '#/components/schemas/TxUser'
        splitAmong:
          type: array
          items: { $ref: '#/components/schemas/TxUser' }
          description: 参与平摊人；空数组表示全体成员
        createdBy: { type: string }
        createdByName: { type: string }
        createdAt: { type: string, format: date-time }
        attachments:
          type: array
          items:
            type: object
            required: [id, filename]
            properties:
              id: { type: string }
              filename: { type: string }
    FinanceSummary:
      description: 项目财务汇总（仅财务管理者可见；门票收入视为项目公款，不挂在任何成员名下）
      type: object
      required: [ticketPriceCents, ticketCount, ticketTypes, ticketIncomeCents, incomeCents, expenseCents, profitCents, perUser, settlement]
      properties:
        ticketPriceCents: { type: integer, description: 旧单票字段——票价（分），多票种保存时清零 }
        ticketCount: { type: integer, description: 旧单票字段——售票数量，多票种保存时清零 }
        ticketTypes:
          type: array
          items:
            type: object
            required: [name, priceCents, count]
            properties:
              name: { type: string }
              priceCents: { type: integer }
              count: { type: integer }
        ticketIncomeCents:
          type: integer
          description: 门票总收入（分），等于各票种 priceCents×count 之和加旧单票 ticketPriceCents×ticketCount
        incomeCents: { type: integer, description: 记账收入（不含门票） }
        expenseCents: { type: integer, description: 全部记账支出 }
        profitCents: { type: integer, description: ticketIncomeCents + incomeCents − expenseCents }
        perUser:
          type: array
          description: 覆盖全体项目成员的净额（分）
          items:
            type: object
            required: [userId, name, netCents]
            properties:
              userId: { type: string }
              name: { type: string }
              netCents: { type: integer }
        settlement:
          type: array
          description: 建议转账（净额为负者向为正者转账的贪心结算列表）
          items:
            type: object
            required: [from, to, amountCents]
            properties:
              from: { $ref: '#/components/schemas/TxUser' }
              to: { $ref: '#/components/schemas/TxUser' }
              amountCents: { type: integer }
    ResourceTypeItem:
      description: 物料资源类型
      type: object
      required: [id, name, visibility]
      properties:
        id: { type: string }
        name: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
    ResourceItem:
      description: 物料资源
      type: object
      required: [id, typeId, name, description, visibility, latestVersion, hasPreview, createdAt]
      properties:
        id: { type: string }
        typeId: { type: string }
        name: { type: string }
        description: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
        latestVersion: { type: integer, description: 当前最新版本号，无版本时为 0 }
        hasPreview: { type: boolean, description: 预览接口将返回 200 }
        createdAt: { type: string, format: date-time }
    ResourceVersionItem:
      description: 物料资源版本
      type: object
      required: [version, note, hasPreview, createdBy, createdAt, file]
      properties:
        version: { type: integer }
        note: { type: string }
        hasPreview: { type: boolean, description: 预览接口将返回 200 }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        file:
          description: 版本对应文件；历史遗留版本可能为 null
          type: object
          nullable: true
          required: [id, filename, mime, size]
          properties:
            id: { type: string }
            filename: { type: string }
            mime: { type: string }
            size: { type: integer }
    PhysicalItemStatus:
      description: 物资状态（planned 计划中、in_stock 已入库、in_use 使用中、returned 已归还、disposed 已处置）
      type: string
      enum: [planned, in_stock, in_use, returned, disposed]
    PhysicalCategoryItem:
      description: 实物分类
      type: object
      required: [id, name, order]
      properties:
        id: { type: string }
        name: { type: string }
        order: { type: integer }
    PhysicalItemItem:
      description: 物资条目
      type: object
      required: [id, categoryId, name, spec, unit, plannedQty, onHandQty, usedQty, lostQty, status, responsible, location, tags, note, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string }
        categoryId: { type: string }
        name: { type: string }
        spec: { type: string }
        unit: { type: string }
        plannedQty: { type: integer }
        onHandQty: { type: integer }
        usedQty: { type: integer }
        lostQty: { type: integer }
        status: { $ref: '#/components/schemas/PhysicalItemStatus' }
        responsible:
          type: object
          nullable: true
          required: [userId, name]
          properties:
            userId: { type: string }
            name: { type: string }
        location: { type: string }
        tags:
          type: array
          items: { type: string }
        note: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PhysicalLogItem:
      description: 物资数量/状态变动日志
      type: object
      required: [id, type, qty, status, note, operator, createdAt]
      properties:
        id: { type: string }
        type:
          type: string
          enum: [adjust_on_hand, adjust_used, adjust_lost, status_change]
        qty: { type: integer }
        status:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PhysicalItemStatus'
        note: { type: string }
        operator:
          type: object
          required: [userId, name]
          properties:
            userId: { type: string }
            name: { type: string }
        createdAt: { type: string, format: date-time }
    PhysicalSummary:
      description: 实物清单汇总（总计 + 按分类聚合）
      type: object
      required: [total, byCategory]
      properties:
        total:
          type: object
          required: [planned, onHand, used, lost, count]
          properties:
            planned: { type: integer }
            onHand: { type: integer }
            used: { type: integer }
            lost: { type: integer }
            count: { type: integer }
        byCategory:
          type: array
          items:
            type: object
            required: [categoryId, planned, onHand, used, lost, count]
            properties:
              categoryId: { type: string }
              planned: { type: integer }
              onHand: { type: integer }
              used: { type: integer }
              lost: { type: integer }
              count: { type: integer }
    WorkAssignee:
      description: 任务模块成员分配与确认状态
      type: object
      required: [userId, name, confirmedAt, confirmedBy, checkedInAt, completedAt]
      properties:
        userId: { type: string }
        name: { type: string }
        confirmedAt: { type: string, format: date-time, nullable: true }
        confirmedBy: { type: string, nullable: true, description: 确认人用户 ID }
        checkedInAt: { type: string, format: date-time, nullable: true, description: 签到时间 }
        completedAt: { type: string, format: date-time, nullable: true, description: 完成时间 }
    WorkModuleItem:
      description: 现场任务模块
      type: object
      required: [id, name, description, location, startAt, endAt, requiredCount, assignees, createdBy, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        location: { type: string }
        startAt: { type: string, format: date-time, nullable: true }
        endAt: { type: string, format: date-time, nullable: true }
        requiredCount: { type: integer, description: 所需人力 }
        assignees:
          type: array
          items: { $ref: '#/components/schemas/WorkAssignee' }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    WorkSheetData:
      description: 现场任务单（某成员被分配的模块集合）
      type: object
      required: [project, user, generatedAt, items]
      properties:
        project:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        user:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        generatedAt: { type: string, format: date-time }
        items:
          type: array
          description: 分配给该成员的模块，按 startAt、createdAt 升序
          items: { $ref: '#/components/schemas/WorkModuleItem' }
    OnsiteIncident:
      description: 现场异常记录
      type: object
      required: [id, category, note, moduleId, moduleName, reporter, status, createdAt]
      properties:
        id: { type: string }
        category:
          type: string
          enum: [equipment, staff, material, venue, safety, other]
        note: { type: string }
        moduleId: { type: string, nullable: true }
        moduleName: { type: string, nullable: true }
        reporter:
          type: object
          required: [userId, name]
          properties:
            userId: { type: string }
            name: { type: string }
        status: { type: string, enum: [open, resolved] }
        createdAt: { type: string, format: date-time }
    StageParticipant:
      description: 舞台节目参与者
      type: object
      required: [cn, contact]
      properties:
        cn: { type: string, description: 圈名（CN） }
        contact: { type: string, description: 联系方式 }
    StageRundownAttachment:
      description: 节目素材附件（复用 File 模型，经 GET /api/files/{id} 下载）
      type: object
      required: [id, filename, mime, size]
      properties:
        id: { type: string }
        filename: { type: string }
        mime: { type: string }
        size: { type: integer, description: 字节数 }
    StageRundownItem:
      description: Rundown 节目条目；顺序即 items 数组下标，起止时间由前端自 startAt 逐项累加 durationMin 推算
      type: object
      required: [id, name, durationMin, participants, attachments, note]
      properties:
        id: { type: string }
        name: { type: string }
        durationMin: { type: integer, description: 时长（分钟） }
        participants:
          type: array
          items: { $ref: '#/components/schemas/StageParticipant' }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/StageRundownAttachment' }
        note: { type: string }
    StageActual:
      description: 节目实际执行记录；每节目至多一条（最近一次执行）
      type: object
      required: [itemId, startedAt, endedAt]
      properties:
        itemId: { type: string }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time, nullable: true }
    StageExecution:
      description: 执行状态（内嵌于 Rundown）；计划数据 startAt/durationMin 执行期不被改写，未开始节目预计时间 = 计划 + shiftMin
      type: object
      required: [status, currentItemId, startedAt, finishedAt, shiftMin, actuals]
      properties:
        status: { type: string, enum: [idle, running, finished] }
        currentItemId: { type: string, nullable: true, description: 当前节目（finished 时为 null） }
        startedAt: { type: string, format: date-time, nullable: true, description: 首个节目实际上场时刻 }
        finishedAt: { type: string, format: date-time, nullable: true }
        shiftMin: { type: integer, description: 顺延累积（分钟，可负表示提前） }
        actuals:
          type: array
          items: { $ref: '#/components/schemas/StageActual' }
    StageRundown:
      description: 舞台 Rundown 完整文档
      type: object
      required: [id, name, startAt, note, items, execution, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        startAt: { type: string, format: date-time, description: 计划开始时刻 }
        note: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/StageRundownItem' }
        execution: { $ref: '#/components/schemas/StageExecution' }
        createdBy: { type: string, description: 创建者用户 id }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StageRundownSummary:
      description: Rundown 列表摘要
      type: object
      required: [id, name, startAt, note, itemCount, totalDurationMin, executionStatus, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        startAt: { type: string, format: date-time }
        note: { type: string }
        itemCount: { type: integer }
        totalDurationMin: { type: integer, description: 全部节目时长之和 }
        executionStatus: { type: string, enum: [idle, running, finished] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StageScreenShareInfo:
      description: 现场大屏分享信息
      type: object
      required: [enabled, token]
      properties:
        enabled: { type: boolean }
        token: { type: string, description: 公开访问令牌 }
    StageSignupReview:
      description: 报名节目投票记录，userName 由后端按投票者解析（已注销用户显示「未知用户」）
      type: object
      required: [userId, userName, decision, comment, updatedAt]
      properties:
        userId: { type: string }
        userName: { type: string }
        decision:
          type: string
          enum: [approve, reject]
        comment: { type: string }
        updatedAt: { type: string, format: date-time }
    StageSignupItem:
      description: 报名节目
      type: object
      required: [id, name, durationMin, participants, note, status, reviews]
      properties:
        id: { type: string }
        name: { type: string }
        durationMin: { type: integer, description: 时长（分钟） }
        participants:
          type: array
          items: { $ref: '#/components/schemas/StageParticipant' }
        note: { type: string }
        status:
          type: string
          enum: [pending, approved, rejected]
        reviews:
          type: array
          items: { $ref: '#/components/schemas/StageSignupReview' }
    StageSignup:
      description: 报名批次详情
      type: object
      required: [id, name, startAt, endAt, note, items, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        note: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/StageSignupItem' }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StageSignupSummary:
      description: 报名批次摘要，availableMin 为 endAt − startAt 折算分钟
      type: object
      required: [id, name, startAt, endAt, note, itemCount, approvedCount, totalDurationMin, availableMin, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        note: { type: string }
        itemCount: { type: integer }
        approvedCount: { type: integer }
        totalDurationMin: { type: integer }
        availableMin: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LostFoundItem:
      description: 失物招领物品（项目内视图）
      type: object
      required: [id, name, note, foundAt, foundLocation, status, claimedAt, claimNote, hasPhoto, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        note: { type: string, description: 特征描述 }
        foundAt: { type: string, format: date-time, description: 捡到时间 }
        foundLocation: { type: string, description: 捡到地点 }
        status:
          type: string
          enum: [pending, claimed]
          description: 待认领 / 已认领
        claimedAt: { type: string, format: date-time, nullable: true }
        claimNote: { type: string, description: 认领备注/联系方式，仅项目内可见 }
        hasPhoto: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PublicLostFoundItem:
      description: 失物招领物品（公开白名单字段，不含 claimNote/createdBy 等内部字段）
      type: object
      required: [id, name, note, foundAt, foundLocation, status, claimedAt, hasPhoto]
      properties:
        id: { type: string }
        name: { type: string }
        note: { type: string }
        foundAt: { type: string, format: date-time }
        foundLocation: { type: string }
        status:
          type: string
          enum: [pending, claimed]
        claimedAt: { type: string, format: date-time, nullable: true }
        hasPhoto: { type: boolean }
    LostFoundShareInfo:
      description: 失物招领公开分享信息
      type: object
      required: [enabled, token]
      properties:
        enabled: { type: boolean }
        token: { type: string }
    CustomTool:
      description: 项目自定义工具
      type: object
      required: [id, name, url, description, mode, passToken, scopes, createdBy, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string }
        description: { type: string }
        mode:
          type: string
          enum: [embed, link]
          description: embed 为页内 iframe，link 为新标签页
        passToken: { type: boolean, description: 打开时经 postMessage 握手投递 5 分钟启动令牌（不进 URL） }
        scopes:
          type: array
          items: { type: string }
          description: 允许插件使用的权限点（仅 ALL_PERMISSIONS 内项，非法项静默丢弃）
        createdBy:
          type: object
          required: [userId, name]
          properties:
            userId: { type: string }
            name: { type: string, description: 创建者已注销显示「未知用户」 }
        createdAt: { type: string, format: date-time }
