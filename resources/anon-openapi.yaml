            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 无 project:manage 权限（forbidden / api_key_forbidden / api_key_wrong_project）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 风险不存在（not_found）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
