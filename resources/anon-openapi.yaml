  /api/public/rundown-screen/{token}:
    get:
      tags: [舞台 Rundown]
      summary: 获取现场大屏公开数据
      security: []
      description: 免登录公开端点，限流 300 次/分钟/IP。分享不存在、未开启或 Rundown 已删除一律 404「链接不存在或已关闭」。白名单输出：items 不含 note 与 attachments，participants 仅 cn（联系方式不外泄）；announcements 仅紧急类型、未过期、全员可见（visibility 双空）的前 5 条，按 isPinned、publishedAt 倒序。
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 大屏白名单数据
          content:
            application/json:
              schema:
                type: object
                required: [projectName, now, rundown, announcements]
                properties:
                  projectName: { type: string }
                  now: { type: string, format: date-time, description: 服务器当前时刻 }
                  rundown:
                    type: object
                    required: [name, startAt, items, execution]
                    properties:
                      name: { type: string }
                      startAt: { type: string, format: date-time }
                      items:
                        type: array
                        items:
                          type: object
                          required: [id, name, durationMin, participants]
                          properties:
                            id: { type: string }
                            name: { type: string }
                            durationMin: { type: integer }
                            participants:
                              type: array
                              items:
                                type: object
                                required: [cn]
                                properties:
                                  cn: { type: string }
                      execution: { $ref: '#/components/schemas/StageExecution' }
                  announcements:
                    type: array
                    items:
                      type: object
                      required: [id, title, content, publishedAt]
                      properties:
                        id: { type: string }
                        title: { type: string }
                        content: { type: string }
                        publishedAt: { type: string, format: date-time }
        '404':
          description: 链接不存在或已关闭（not_found）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: 请求过于频繁（rate_limited）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
