          content:
            application/json:
              schema:
                type: object
                required: [risks, health]
                properties:
                  risks:
                    type: array
                    items: { $ref: '#/components/schemas/RiskItem' }
                  health: { $ref: '#/components/schemas/HealthStatus' }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/projects/{id}/risks/{riskId}/ignore:
