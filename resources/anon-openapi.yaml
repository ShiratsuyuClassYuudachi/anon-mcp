  /api/projects/{id}/finance:
    get:
      tags: [财务]
      summary: 列出账目与汇总
      description: 任一项目成员可用。财务管理者（finance:manage 或 project:manage）见全部账目与完整汇总；finance:add 记账者仅见自己添加的账目且 summary 为 null。transactions 按创建时间倒序。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 账目列表与汇总
          content:
            application/json:
              schema:
                type: object
                required: [transactions, summary]
                properties:
                  transactions:
                    type: array
                    items: { $ref: '#/components/schemas/TransactionItem' }
                  summary:
                    $ref: '#/components/schemas/FinanceSummary'
                    nullable: true
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非项目成员（forbidden / api_key_forbidden / api_key_wrong_project）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [财务]
      summary: 新建账目
      description: 需 finance:manage 或 finance:add 权限。金额以元提交（最多两位小数），服务端转换为整数分。payerUserId 与 splitAmong 必须是项目成员。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, amount, payerUserId]
              properties:
                type: { type: string, enum: [income, expense] }
                amount:
                  type: number
                  description: 金额（元，必须为正，最多两位小数；也接受数字字符串）
                note: { type: string }
                payerUserId:
                  type: string
                  description: 支出为付款人，收入为收款人；必须是项目成员
                splitAmong:
                  type: array
                  items: { type: string }
                  description: 参与平摊人 userId 列表；缺省或空数组表示全体成员
          multipart/form-data:
            schema:
              type: object
              required: [type, amount, payerUserId]
              properties:
                type: { type: string, enum: [income, expense] }
                amount: { type: string, description: 金额（元，必须为正，最多两位小数） }
                note: { type: string }
                payerUserId: { type: string }
                splitAmong:
                  type: string
                  description: 参与平摊人 userId，JSON 数组字符串或逗号分隔
                files:
                  type: array
                  items: { type: string, format: binary }
                  description: 凭证附件，最多 10 个，单个 ≤20MB
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                required: [transaction]
                properties:
                  transaction: { $ref: '#/components/schemas/TransactionItem' }
        '400':
          description: 参数错误（bad_request，金额无效或成员校验失败）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 无记账权限（forbidden / api_key_forbidden / api_key_wrong_project）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/projects/{id}/finance/ticket:
    patch:
      tags: [财务]
      summary: 设置门票
      description: 需 finance:manage 权限。支持两种请求体——多票种（ticketTypes 数组，0~20 个，保存时清零旧单票字段）与旧单票格式（ticketPrice + ticketCount，兼容保留）；响应形态随请求体而定。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ticketTypes:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required: [name, price, count]
                    properties:
                      name: { type: string, maxLength: 20 }
                      price: { type: number, description: 单价（元，≥0，最多两位小数） }
                      count: { type: integer, minimum: 0 }
                ticketPrice:
                  type: number
                  description: 旧单票格式——票价（元，≥0，最多两位小数；也接受数字字符串）
                ticketCount: { type: integer, minimum: 0, description: 旧单票格式——售票数量 }
      responses:
        '200':
          description: 设置成功。多票种请求返回 { ticketTypes, ticketIncomeCents }（金额单位为分）；旧单票请求返回 { ticketPriceCents, ticketCount }
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticketTypes:
                    type: array
                    items:
                      type: object
                      required: [name, priceCents, count]
                      properties:
                        name: { type: string }
                        priceCents: { type: integer }
                        count: { type: integer }
                  ticketIncomeCents: { type: integer, description: 多票种形态——门票总收入（分） }
                  ticketPriceCents: { type: integer, description: 旧单票形态——票价（分） }
                  ticketCount: { type: integer, description: 旧单票形态——售票数量 }
        '400':
          description: 参数错误（bad_request，票种或票价无效）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未认证（unauthorized）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 无财务管理权限（forbidden / api_key_forbidden / api_key_wrong_project）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
