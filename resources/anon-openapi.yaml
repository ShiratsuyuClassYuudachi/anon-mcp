                  name: { type: string, description: 形如「项目名 待办模板」 }
                  exportedAt: { type: string, format: date-time }
                  anchorField: { type: string, enum: [start, end, export], description: 锚点来源字段 }
                  anchorDate: { type: string, format: date-time }
                  todos:
                    type: array
                    items:
                      type: object
                      required: [title, nodeOffsetMs, dueOffsetMs, remindOffsetMs]
                      properties:
                        title: { type: string }
                        category: { type: string }
                        note: { type: string }
                        nodeOffsetMs: { type: integer, nullable: true, description: 相对锚点的毫秒偏移，可为负 }
                        dueOffsetMs: { type: integer, nullable: true }
                        remindOffsetMs: { type: integer, nullable: true }
